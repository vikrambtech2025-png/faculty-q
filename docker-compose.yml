version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: facultyq
      POSTGRES_PASSWORD: facultyq
      POSTGRES_DB: facultyq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://facultyq:facultyq@postgres:5432/facultyq
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
volumes:
  pgdata: